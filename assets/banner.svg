<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
    <filter id="markerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#334155" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="480" fill="url(#bg)"/>

  <!-- subtle decorative grid -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.45">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/>
    <line x1="1120" y1="0" x2="1120" y2="480"/>
  </g>

  <!-- left text area -->
  <g transform="translate(72, 130)">
    <!-- title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">等时圈通勤工具</text>

    <!-- subtitle -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="22" font-weight="400" fill="#475569">基于高德地图的纯前端通勤分析工具</text>

    <!-- feature tags -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/>
      <text x="59" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#1e40af">双起点对比</text>

      <rect x="132" y="0" width="104" height="34" rx="17" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
      <text x="184" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#166534">真实路网</text>

      <rect x="250" y="0" width="128" height="34" rx="17" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
      <text x="314" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="14" font-weight="600" fill="#9a3412">批量算通勤</text>
    </g>

    <!-- scenario line -->
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="15" fill="#64748b">租房 · 买房 · 双职工 · 求学 · 商业选址 · 让通勤时间一目了然</text>
  </g>

  <!-- right illustration: map card -->
  <g transform="translate(740, 80)" filter="url(#softShadow)">
    <rect x="0" y="0" width="460" height="320" rx="18" fill="url(#card)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- map base -->
    <circle cx="230" cy="160" r="132" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- simplified road grid inside map -->
    <g stroke="#e2e8f0" stroke-width="2" stroke-linecap="round">
      <line x1="130" y1="160" x2="330" y2="160"/>
      <line x1="230" y1="60" x2="230" y2="260"/>
      <line x1="160" y1="90" x2="300" y2="230"/>
      <line x1="300" y1="90" x2="160" y2="230"/>
    </g>

    <!-- isochrone rings around point A (left-center), using app color scale -->
    <g opacity="0.18">
      <circle cx="180" cy="140" r="105" fill="#dc2626"/>
      <circle cx="180" cy="140" r="78" fill="#ea580c"/>
      <circle cx="180" cy="140" r="52" fill="#d97706"/>
      <circle cx="180" cy="140" r="26" fill="#059669"/>
    </g>
    <g fill="none" stroke-width="2" opacity="0.55">
      <circle cx="180" cy="140" r="105" stroke="#dc2626"/>
      <circle cx="180" cy="140" r="78" stroke="#ea580c"/>
      <circle cx="180" cy="140" r="52" stroke="#d97706"/>
      <circle cx="180" cy="140" r="26" stroke="#059669"/>
    </g>

    <!-- isochrone rings around point B (right-center) -->
    <g opacity="0.14">
      <circle cx="290" cy="190" r="82" fill="#7c3aed"/>
      <circle cx="290" cy="190" r="58" fill="#3b82f6"/>
      <circle cx="290" cy="190" r="34" fill="#0891b2"/>
    </g>
    <g fill="none" stroke-width="2" opacity="0.5">
      <circle cx="290" cy="190" r="82" stroke="#7c3aed"/>
      <circle cx="290" cy="190" r="58" stroke="#3b82f6"/>
      <circle cx="290" cy="190" r="34" stroke="#0891b2"/>
    </g>

    <!-- candidate location buildings / houses -->
    <g fill="#64748b" opacity="0.85">
      <rect x="150" y="210" width="12" height="12" rx="2"/>
      <rect x="210" y="90" width="14" height="14" rx="2"/>
      <rect x="250" y="230" width="12" height="16" rx="2"/>
      <rect x="330" y="130" width="13" height="13" rx="2"/>
      <rect x="120" y="100" width="11" height="11" rx="2"/>
      <rect x="310" y="80" width="12" height="12" rx="2"/>
    </g>

    <!-- point A marker -->
    <g transform="translate(180, 140)" filter="url(#markerShadow)">
      <circle r="11" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
      <rect x="-14" y="-38" width="28" height="20" rx="6" fill="#dc2626"/>
      <text x="0" y="-23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#ffffff">A</text>
      <polygon points="0,-18 -5,-10 5,-10" fill="#dc2626"/>
    </g>

    <!-- point B marker -->
    <g transform="translate(290, 190)" filter="url(#markerShadow)">
      <circle r="11" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
      <rect x="-14" y="-38" width="28" height="20" rx="6" fill="#7c3aed"/>
      <text x="0" y="-23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#ffffff">B</text>
      <polygon points="0,-18 -5,-10 5,-10" fill="#7c3aed"/>
    </g>

    <!-- legend -->
    <g transform="translate(28, 278)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#059669"/>
      <text x="20" y="11" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="#475569">≤30′</text>

      <rect x="64" y="0" width="12" height="12" rx="3" fill="#d97706"/>
      <text x="84" y="11" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="#475569">≤45′</text>

      <rect x="128" y="0" width="12" height="12" rx="3" fill="#ea580c"/>
      <text x="148" y="11" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="#475569">≤60′</text>

      <rect x="192" y="0" width="12" height="12" rx="3" fill="#dc2626"/>
      <text x="212" y="11" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="12" fill="#475569">&gt;60′</text>
    </g>
  </g>
</svg>