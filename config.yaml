# 高德地图 JS API 密钥配置
# 请到 https://console.amap.com 申请：应用管理 → 创建 Key → 服务平台选「Web端(JS API)」
# 安全密钥（securityJsCode）在「Key 设置」里获取
#
# 注意：
# 1. 本工具是静态页面，config.yaml 会被浏览器下载，请勿在公开仓库中提交真实密钥。
# 2. 密钥不在页面展示，也没有常驻设置入口；仅当此处留空或密钥失效时，
#    页面才弹出引导窗口，让用户在浏览器本地（localStorage）输入自己的密钥。
# 3. 仅供个人/小范围使用时，可把真实密钥填在这里并部署；公开项目建议通过 CI 注入或让用户自备。

amap_key: "5de7e88ddd6394018ae67a6edd6d6b36"
amap_code: "60bbb317a7bd772d25a8a35acc08f590"

# Mapbox Token（仅驾车/骑行/步行(Mapbox)圈用，公开 pk token 即可）
mapbox_token: ""

# 近似等时圈配速（开发者配置，页面不提供修改入口；精确路网圈不受影响）
walk_speed: 4.5    # 步行 km/h，合理范围 1-20
ride_speed: 9      # 骑行 km/h，合理范围 3-40

# 地图初始视角（GCJ-02 坐标，与高德地图一致）
# 格式：经度,纬度
map_center: "121.4997,31.2397"   # 上海陆家嘴
map_zoom: 12
